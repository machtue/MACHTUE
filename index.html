<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>LOGIN.ifoody</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 300px;
      margin: 20px auto;
      padding: 0 20px;
      background-color: #f7f7f7;
      color: #333333;
    }

    .container-imagem {
      text-align: center;
      margin-bottom: 20px;
    }

    .container-imagem img {
      max-width: 100px;
      height: auto;
      border-radius: 8px;
    }

    h1 {
      color: #ea1d2c; /* Vermelho iFood */
    }

    p {
      color: #555555;
      margin-top: 10px;
      margin-bottom: 2px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-bottom: 5px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none; /* Remove o contorno padrão do navegador */
    }

    /* Borda neutra mantida ao clicar/digitar */
    input:focus {
      border-color: #999;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #ea1d2c; /* Vermelho iFood */
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #c81624;
    }
  </style>
</head>
<body>

  <div class="container-imagem">
    <img src="lig.jpg" alt="Foto do Aluno">
    <h1>CADASTRO</h1>
    <p>crie seu acesso</p>
  </div>

  <p>Digite seu nome</p>
  <input type="text">

  <p>Digite sua senha</p>
  <input type="password">

  <p>Digite seu endereço</p>
  <input type="text">

  <p>Digite seu número de telefone</p>
  <input type="text">

  <p>Digite seu email</p>
  <input type="email">

  <button>Cadastrar</button>

</body>
</html>
